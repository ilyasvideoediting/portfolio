let Z={s:1,x:0,y:0},curIm=null,ptr=new Map(),pd=0,pm=null,tapDown=null,lastTap=null;
const clampZ=()=>{const w=vi.clientWidth,h=vi.clientHeight;Z.s=Math.min(6,Math.max(1,Z.s));Z.x=Math.min(0,Math.max(w-w*Z.s,Z.x));Z.y=Math.min(0,Math.max(h-h*Z.s,Z.y));if(Z.s===1){Z.x=0;Z.y=0}};
const applyZ=()=>{clampZ();vimg.style.transform=`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`};
const zoomAt=(f,cx,cy)=>{const s0=Z.s,s1=Math.min(6,Math.max(1,s0*f)),k=s1/s0;Z.x=cx-(cx-Z.x)*k;Z.y=cy-(cy-Z.y)*k;Z.s=s1;applyZ()};
const sizeI=()=>{if(!curIm)return;const r=curIm.naturalWidth/curIm.naturalHeight,w=Math.min(innerWidth-56,1076,innerHeight*.72*r);vi.style.width=w+"px";vi.style.height=w/r+"px";applyZ()};
function openI(im){curIm=im;vp.pause();vp.hidden=true;ve.hidden=true;vi.hidden=false;vb.classList.add("img");Z={s:1,x:0,y:0};ptr.clear();vimg.src=im.src;vimg.alt=im.alt;vimg.style.transform="none";sizeI();vm.classList.add("on");document.body.style.overflow="hidden"}
addEventListener("resize",()=>{if(!vi.hidden&&vm.classList.contains("on"))sizeI()});
const lp=e=>{const r=vi.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
vi.addEventListener("pointerdown",e=>{try{vi.setPointerCapture(e.pointerId)}catch(_){}ptr.set(e.pointerId,[e.clientX,e.clientY]);
if(ptr.size===2){const[a,b]=[...ptr.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1]);pm=[(a[0]+b[0])/2,(a[1]+b[1])/2];tapDown=null}
else if(ptr.size===1)tapDown=[e.clientX,e.clientY,performance.now()]});
vi.addEventListener("pointermove",e=>{if(!ptr.has(e.pointerId))return;const pv=ptr.get(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);
if(ptr.size===2){const[a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),m=[(a[0]+b[0])/2,(a[1]+b[1])/2],r=vi.getBoundingClientRect();
if(pd){Z.x+=m[0]-pm[0];Z.y+=m[1]-pm[1];zoomAt(d/pd,m[0]-r.left,m[1]-r.top)}pd=d;pm=m}
else if(Z.s>1){Z.x+=e.clientX-pv[0];Z.y+=e.clientY-pv[1];applyZ()}});
const endP=e=>{if(!ptr.has(e.pointerId))return;ptr.delete(e.pointerId);pd=0;pm=null;
if(e.type==="pointerup"&&ptr.size===0&&tapDown&&Math.hypot(e.clientX-tapDown[0],e.clientY-tapDown[1])<12&&performance.now()-tapDown[2]<350){const now=performance.now();
if(lastTap&&now-lastTap[2]<320&&Math.hypot(e.clientX-lastTap[0],e.clientY-lastTap[1])<40){const[x,y]=lp(e);if(Z.s>1.05){Z={s:1,x:0,y:0};applyZ()}else zoomAt(2.5,x,y);lastTap=null}else lastTap=[e.clientX,e.clientY,now]}
if(ptr.size===0)tapDown=null};
vi.addEventListener("pointerup",endP);vi.addEventListener("pointercancel",endP);
vi.addEventListener("wheel",e=>{e.preventDefault();const[x,y]=lp(e);zoomAt(Math.exp(-e.deltaY*.002),x,y)},{passive:false});
$(".rev img").forEach(im=>{im.tabIndex=0;im.setAttribute("role","button");im.onclick=()=>openI(im);im.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openI(im)}}});
const MG=".pz,.st,.tool,.pick";let cur=null;
const rel=el=>{if(!el)return;el.classList.remove("mg");el.style.translate="";el.style.scale="";el._tx=el._ty=0};
const pull=(el,e)=>{if(rm())return;const r=el.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight,
cx=r.left+r.width/2-(el._tx||0),cy=r.top+r.height/2-(el._ty||0),
dx=Math.max(-.6,Math.min(.6,(e.clientX-cx)/w)),dy=Math.max(-.6,Math.min(.6,(e.clientY-cy)/h));
el._tx=dx*w*.3;el._ty=dy*h*.4;el.classList.add("mg");el.style.translate=`${el._tx}px ${el._ty}px`;el.style.scale=`${1+Math.abs(dx)*.3} ${1+Math.abs(dy)*.4}`};
document.addEventListener("pointermove",e=>{const t=document.elementFromPoint(e.clientX,e.clientY),el=t&&t.closest(MG);if(el!==cur){rel(cur);cur=el}if(el)pull(el,e)});
document.addEventListener("pointerdown",e=>{const el=e.target.closest(MG);if(el){cur=el;pull(el,e)}});
["pointerup","pointercancel"].forEach(t=>document.addEventListener(t,e=>{if(e.pointerType!=="mouse"){rel(cur);cur=null}}));
document.documentElement.addEventListener("pointerleave",()=>{rel(cur);cur=null});
setLang(L);
